<!DOCTYPE html>
<html lang="ru">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">

 <link rel="stylesheet" href="assets/css/main.css">
 <link rel="stylesheet" href="components/footer/footer.css">
 <link rel="stylesheet" href="components/button/sp-button/sp-button.css">
 <link rel="stylesheet" href="components/checkbox/sp-checkbox.css">
 <link rel="stylesheet" href="components/radio/sp-radio.css">
 <link rel="stylesheet" href="components/switch/sp-switch.css">
</head>

<body>

<div id="section_cu">
 <sp-heading size="s">Затянуть в 2%</sp-heading>
 <sp-radio-group id="radio_group_cu">
  <sp-label style="min-width: 3rem">кроме</sp-label>
  <sp-radio size="s" class="sp-radio" value="cyan"><span>C</span></sp-radio>
  <sp-radio size="s" class="sp-radio" value="magenta"><span>M</span></sp-radio>
  <sp-radio size="s" class="sp-radio" value="yellow"><span>Y</span></sp-radio>
  <sp-radio size="s" class="sp-radio" value="black"><span>K</span></sp-radio>
 </sp-radio-group>
 <div class="checkbox-group" id="chbox_group_cu">
  <sp-label style="min-width: 3rem">только</sp-label>
  <sp-checkbox size="s" class="sp-checkbox" value="cyan"><span>C</span></sp-checkbox>
  <sp-checkbox size="s" class="sp-checkbox" value="magenta"><span>M</span></sp-checkbox>
  <sp-checkbox size="s" class="sp-checkbox" value="yellow"><span>Y</span></sp-checkbox>
  <sp-checkbox size="s" class="sp-checkbox" value="black"><span>K</span></sp-checkbox>
 </div>
 <div>
  <sp-switch id="rm_mask_cu" class="sp-switch" size="s" checked><span>удалить маску</span></sp-switch>
 </div>
 <div>
  <sp-switch id="link_to_lay_cu" class="sp-switch" size="s" checked><span>привязать к слою</span></sp-switch>
 </div>
 <div>
  <sp-button id="btnAddCu" variant="primary" size="s">добавить cu</sp-button>
 </div>
</div>

<div id="section_cha">
 <sp-heading size="s">Убрать в 0% каналы</sp-heading>
 <sp-radio-group>
  <sp-label style="min-width: 3rem" size="m">только</sp-label>
  <sp-radio size="s" class="sp-radio" value="cyan"><span>C</span></sp-radio>
  <sp-radio size="s" class="sp-radio" value="magenta"><span>M</span></sp-radio>
  <sp-radio size="s" class="sp-radio" value="yellow"><span>Y</span></sp-radio>
  <sp-radio size="s" class="sp-radio" value="black"><span>K</span></sp-radio>
 </sp-radio-group>
 <sp-field-group>
  <sp-label style="min-width: 3rem">кроме</sp-label>
  <sp-checkbox size="s" class="sp-checkbox" value="cyan"><span>C</span></sp-checkbox>
  <sp-checkbox size="s" class="sp-checkbox" value="magenta"><span>M</span></sp-checkbox>
  <sp-checkbox size="s" class="sp-checkbox" value="yellow"><span>Y</span></sp-checkbox>
  <sp-checkbox size="s" class="sp-checkbox" value="black"><span>K</span></sp-checkbox>
 </sp-field-group>
 <div>
  <sp-switch id="rm_mask_cha" class="sp-switch" size="s" checked><span>удалить маску</span></sp-switch>
 </div>
 <div>
  <sp-switch id="link_to_lay_cha" class="sp-switch" size="s" checked><span>привязать к слою</span></sp-switch>
 </div>
 <div>
  <sp-button id="btnAddCha" variant="primary" size="s">добавить cha</sp-button>
 </div>
</div>

<script src="assets/js/cu2.js"></script>
<script src="assets/js/cha0.js"></script>
<script src="assets/js/radioCheckboxHandler.js"></script>
</body>

</html>
